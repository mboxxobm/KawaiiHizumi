name: Build Plugins

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    name: macOS Universal AU/VST3
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DKAWAII_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kawaii-Hizumi-macOS
          path: |
            build/KawaiiHizumi_artefacts/Release/AU/Kawaii Hizumi.component
            build/KawaiiHizumi_artefacts/Release/VST3/Kawaii Hizumi.vst3
            build/KawaiiHizumi_artefacts/Release/Standalone/Kawaii Hizumi.app

  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DKAWAII_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kawaii-Hizumi-Windows
          path: |
            build/KawaiiHizumi_artefacts/Release/VST3/Kawaii Hizumi.vst3
            build/KawaiiHizumi_artefacts/Release/Standalone/Kawaii Hizumi.exe
